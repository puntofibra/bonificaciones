<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bonificaciones</title>
<meta name="theme-color" content="#07070f">
<meta name="description" content="Bonificaciones FuturMovil: pide la devolución de tus recibos de fibra y móvil.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bonificaciones">
<style>
:root{--bg:#07070f;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--a:#ec4899;--b:#fb923c;--ok:#34d399;--bad:#fb7185;--mut:#9a9ab8;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#fff;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.mut{color:var(--mut)}
[hidden]{display:none!important}

/* fondo animado */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 22s ease-in-out infinite}
.bg i:nth-child(1){background:var(--a);left:-15vmax;top:-15vmax}
.bg i:nth-child(2){background:var(--b);right:-20vmax;bottom:-20vmax;animation-delay:-8s}
.bg i:nth-child(3){background:#a855f7;width:35vmax;height:35vmax;left:40%;top:30%;opacity:.18;animation-delay:-14s}
@keyframes float{50%{transform:translate(8vmax,6vmax) scale(1.15)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99}

/* piezas */
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:var(--r);padding:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.btn{border:0;cursor:pointer;border-radius:14px;padding:13px 18px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;transition:transform .15s,box-shadow .2s,opacity .2s;box-shadow:0 8px 24px rgba(236,72,153,.35)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(236,72,153,.5)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--glass);border:1px solid var(--bd);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#f43f5e,#fb923c)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.big{width:100%;padding:16px;font-size:16px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:13px;padding:13px 14px;outline:0;transition:border .2s,box-shadow .2s}
input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(236,72,153,.2)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px;letter-spacing:.4px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.link{background:none;border:0;color:var(--b);cursor:pointer;padding:6px 0;font-size:14px}

/* barra superior */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(7,7,15,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;flex:1;min-width:0}
.brand .lg{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:18px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{color:var(--mut);font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:18px}

/* AUTH */
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px}
.authbox{width:min(440px,100%);animation:rise .6s both}
.authcol{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.sharebtn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-weight:700;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:rise .8s both}
.sharebtn:active{transform:scale(.97)}
#go{position:relative;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#go.lp::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3);transform-origin:left;animation:lpfill 3s linear forwards;pointer-events:none}
@keyframes lpfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero{display:none}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:32px;margin:0 auto 14px;box-shadow:0 10px 36px rgba(236,72,153,.5);animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 10px 50px rgba(251,146,60,.6)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.authbox h1{text-align:center;font-size:26px}
.authbox .sub{text-align:center;margin:6px 0 10px}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:18px;padding:6px}

/* TARJETA 3D */
.card3d{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:relative;aspect-ratio:1.586;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:linear-gradient(135deg,#9d174d,#db2777 45%,#f97316);background-size:200% 200%;animation:grad 9s ease infinite;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s;box-shadow:0 25px 60px rgba(157,23,77,.5)}
@keyframes grad{50%{background-position:100% 100%}}
.card3d .shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.card3d:after{content:"";position:absolute;width:140%;height:60px;background:rgba(255,255,255,.08);transform:rotate(-25deg);left:-20%;top:30%;animation:sweep 6s infinite}
@keyframes sweep{0%,60%{transform:translateX(-120%) rotate(-25deg)}100%{transform:translateX(120%) rotate(-25deg)}}
.c-top,.c-bot{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:1.5px;font-size:13px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;font-size:11px}
.gift{width:58px;height:58px;flex:none;margin:-8px -6px 0 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));animation:giftf 3.2s ease-in-out infinite}
.gift .sp{transform-box:fill-box;transform-origin:center;animation:twk 2s ease-in-out infinite}.gift .sp2{animation-delay:.7s}.gift .sp3{animation-delay:1.3s}
@keyframes giftf{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
@keyframes twk{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
.c-bal{position:relative;z-index:1}
.c-bal b{font-size:clamp(44px,12vw,64px);line-height:1;font-weight:800;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.c-bal small{margin-left:8px;opacity:.85;font-size:15px}
.c-eur{position:relative;z-index:1;opacity:.9;font-size:15px;margin-top:2px}

/* QR */
.qrbox{text-align:center}
.qrwrap{background:#fff;border-radius:20px;padding:14px;display:inline-block;margin:14px 0 10px;position:relative;box-shadow:0 0 0 6px rgba(236,72,153,.25),0 0 40px rgba(251,146,60,.25);animation:glow 3s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(251,146,60,.3),0 0 55px rgba(236,72,153,.4)}}
#qr img,#qr canvas{display:block;width:min(62vw,220px)!important;height:auto!important}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;max-width:240px;margin:6px auto}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--a),var(--b));transform-origin:left}
.bar i.go{animation:shrink 50s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

/* listas */
.mv{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--bd);animation:rise .4s both}
.mv:last-child{border:0}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none;background:rgba(255,255,255,.08)}
.mv .t{flex:1;min-width:0}
.mv .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .t small{color:var(--mut)}
.pts{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.pts small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.cgrid,.opgrid{display:grid;gap:18px}
.stack{display:grid;gap:18px}
.cgrid .col-l{display:grid;gap:18px}

/* ADMIN */
.adm{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(10,10,22,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;cursor:pointer;padding:8px 2px;border-radius:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600}
.nav button span{font-size:20px}
.nav button.on{color:#fff;background:rgba(236,72,153,.25)}
.adm main{padding-bottom:90px}
.sel .big{font-size:42px;font-weight:800}
.sel .who2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.box{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:14px}
.prev{margin-top:8px;color:var(--b);font-size:14px;min-height:20px}
#reader{border-radius:16px;overflow:hidden;margin-top:12px}
.sug{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:13px;padding:10px 12px;margin-top:8px;cursor:pointer;transition:background .2s}
.sug:hover{background:rgba(236,72,153,.2)}
.sug b{display:block}.sug small{color:var(--mut)}.sug .pts{margin-left:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{padding:18px}
.stat b{display:block;font-size:30px;margin-top:4px}
.off{opacity:.5}
.tag{font-size:11px;border-radius:8px;padding:2px 8px;background:rgba(251,113,133,.2);color:var(--bad);margin-left:6px}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer}
.sw input{width:20px;height:20px}

/* modal / toast */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:end center;animation:fade .2s}
.ov .glass{width:min(480px,100%);background:#12122a;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;animation:up .3s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.tt{background:#1b1b38;border:1px solid var(--bd);border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .3s both;font-size:14px}
.tt.ok{border-color:var(--ok)}.tt.bad{border-color:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ====== ESCRITORIO / HORIZONTAL ====== */
@media (min-width:900px) and (min-height:520px),(min-width:1100px){
  .wrap{padding:28px 32px}
  .top{padding:14px 32px}
  .cgrid{grid-template-columns:minmax(380px,460px) 1fr;align-items:start;gap:28px}
  .cgrid .col-l{display:grid;gap:22px;position:sticky;top:90px}
  .opgrid{grid-template-columns:minmax(320px,420px) 1fr;align-items:start;gap:24px}
  .adm{display:grid;grid-template-columns:230px 1fr;gap:0;max-width:1400px;margin:0 auto}
  .nav{position:sticky;top:64px;align-self:start;height:calc(100dvh - 64px);flex-direction:column;justify-content:flex-start;gap:6px;padding:22px 14px;border-top:0;border-right:1px solid var(--bd);background:transparent;backdrop-filter:none}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:13px 16px;justify-content:flex-start}
  .adm main{padding:28px 32px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  #toast{bottom:28px}
  .auth{grid-template-columns:1.1fr 1fr;gap:40px;max-width:1150px;margin:0 auto}
  .hero{display:block;animation:rise .8s both}
  .hero h2{font-size:clamp(34px,4vw,54px);line-height:1.05;margin-bottom:14px}
  .hero h2 em{font-style:normal;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--mut);font-size:18px;max-width:460px}
  .hero .card3d{width:min(380px,100%);margin-top:30px;transform:perspective(900px) rotateY(-12deg) rotateX(6deg);animation:grad 9s ease infinite,hov 6s ease-in-out infinite}
  @keyframes hov{50%{translate:0 -12px}}
  .authbox{justify-self:center}
  .ov{place-items:center}.ov .glass{border-radius:24px}
}
@media (min-width:900px) and (max-height:520px){ /* móvil en horizontal */
  .cgrid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

img.lg,img.logo{background:none;object-fit:contain;display:block}
/* ===== BONIFICACIONES ===== */
.pig{width:66px;height:66px;flex:none;margin:-12px -10px 0 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));animation:giftf 3.4s ease-in-out infinite}
.pig-empty{width:96px;height:96px;animation:giftf 3.4s ease-in-out infinite}
.pig-sm{width:54px;height:54px;flex:none}
.pig-big{width:130px;height:130px;animation:giftf 3s ease-in-out infinite}
.c-lbl{position:relative;z-index:1;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.pulse{animation:pls 2.4s infinite}
@keyframes pls{0%,100%{box-shadow:0 8px 24px rgba(236,72,153,.35)}50%{box-shadow:0 8px 34px rgba(251,146,60,.6),0 0 0 6px rgba(236,72,153,.15)}}
.dato{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--bd);margin-top:8px}
.dato>span{font-size:20px}.dato>div{flex:1;min-width:0}.dato small{display:block;font-size:11px}.dato b{display:block;font-size:14px;word-break:break-all}
.dato.sm{padding:7px 10px;margin-top:6px}
.mono{font-family:ui-monospace,Consolas,Menlo,monospace;letter-spacing:.5px}
.cp{background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:10px;cursor:pointer;padding:6px 8px;font-size:14px;flex:none;transition:transform .15s;vertical-align:middle}
.cp:active{transform:scale(.88)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{padding:14px 8px;text-align:center;animation:rise .5s both}.mini span{font-size:22px}.mini b{display:block;font-size:19px;margin-top:4px;white-space:nowrap}
.mini2{text-align:center;background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:14px;padding:10px 6px}.mini2 b{display:block;font-size:16px}
.how{margin:8px 0 0;padding-left:20px;color:var(--mut);line-height:1.6}.how b{color:#fff}
.st-pe{--c:#fbbf24}.st-pa{--c:#60a5fa}.st-ok{--c:#34d399}.st-no{--c:#fb7185}.st-ca{--c:#9a9ab8}
.stc{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.ic.st-pe,.ic.st-pa,.ic.st-ok,.ic.st-no,.ic.st-ca{background:color-mix(in srgb,var(--c) 18%,transparent)}
.ic.st-pe{animation:breath 2s infinite}
@keyframes breath{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 15%,transparent)}}
.ic.big{width:52px;height:52px;font-size:24px;border-radius:16px;font-weight:800}
.mv.sol{cursor:pointer;border-radius:12px;transition:background .2s;padding:12px 8px}.mv.sol:hover{background:rgba(255,255,255,.04)}
.off2{color:var(--mut);text-decoration:line-through}
.mh{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.money{position:relative}.money input{font-size:30px;font-weight:800;padding-right:44px}.money span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;align-items:center}.kv span{color:var(--mut)}.kv b{text-align:right;word-break:break-all}
.tl{margin:16px 0 0}
.tl-s{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px;opacity:.45;animation:rise .4s both}
.tl-s:nth-child(2){animation-delay:.12s}.tl-s:nth-child(3){animation-delay:.24s}
.tl-s.on{opacity:1}
.tl-s i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2px solid var(--bd);flex:none;z-index:1}
.tl-s.on i{border-color:var(--a);background:rgba(236,72,153,.18)}
.tl-s:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--bd)}
.tl-s.on:not(:last-child)::before{background:linear-gradient(var(--a),var(--b))}
.tl-s b{display:block;font-size:14px}.tl-s small{color:var(--mut);font-size:12px}
.cards{display:grid;gap:14px}
.scard{border-left:4px solid var(--c);animation:rise .4s both;transition:transform .4s,opacity .4s}
.scard.bye{transform:translateX(60px) scale(.95);opacity:0}
.sc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sc-top b{display:block;font-size:16px}.sc-top small{font-size:12px}
.sc-imp{font-size:26px;font-weight:800;color:var(--c);white-space:nowrap}
.sc-mid{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin:8px 0 4px}.sc-mid b{color:#fff}
.sec{font-size:16px;margin:6px 0 -4px}
.amb{color:#fbbf24}.blu{color:#60a5fa}
.tag.amb{background:rgba(251,191,36,.18);color:#fbbf24}
.btn.ok{background:linear-gradient(135deg,#10b981,#22d3ee);box-shadow:0 8px 24px rgba(16,185,129,.35)}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px 8px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.wrapseg{flex-wrap:wrap}.wrapseg button{flex:none}
.bdg{font-style:normal;background:#f43f5e;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px;font-weight:800;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
input.good{border-color:var(--ok)}input.badi{border-color:var(--bad)}
input[type=date]{color-scheme:dark}
.coin{position:fixed;top:-40px;z-index:98;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a3,#fbbf24 55%,#f59e0b);color:#b45309;font-weight:900;display:grid;place-items:center;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.35);pointer-events:none;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(calc(100dvh + 80px)) rotate(540deg)}}
@media (min-width:900px){.cards{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
.recs{display:grid;gap:6px;margin:10px 0 4px}
.rec{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--bd);font-size:13px;margin:0;color:inherit;letter-spacing:0;cursor:default;animation:rise .35s both}
.rec input{width:auto;margin:0;accent-color:#ec4899;transform:scale(1.2);cursor:pointer}

<body>
<div class="bg"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<div id="app"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
/* ═════════ CONFIGURACIÓN ═════════ */
const API = 'https://script.google.com/macros/s/AKfycbyzxVEjAidI8zF6qwlhZdXUtpRnsIY1K3wn-h-H-kxaSALM8dS8znbdaTkMBtx2HlUU1w/exec';   // URL /exec de Apps Script
const APP = 'Bonificaciones';
const PIG = "<defs>  <clipPath id=\"bodyc\"><ellipse cx=\"240\" cy=\"318\" rx=\"168\" ry=\"122\"/></clipPath>  <linearGradient id=\"cg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFD24A\"/><stop offset=\".55\" stop-color=\"#FFB020\"/><stop offset=\".56\" stop-color=\"#FF9A1A\"/><stop offset=\"1\" stop-color=\"#FF8A12\"/></linearGradient></defs><g stroke=\"#262626\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-linejoin=\"round\">  <!-- patas traseras (sombra) -->  <rect x=\"186\" y=\"392\" width=\"46\" height=\"70\" rx=\"14\" fill=\"#DB4C8E\"/>  <rect x=\"284\" y=\"392\" width=\"46\" height=\"70\" rx=\"14\" fill=\"#DB4C8E\"/>  <!-- moneda -->  <circle cx=\"250\" cy=\"138\" r=\"74\" fill=\"url(#cg)\"/>  <path d=\"M210 104 A52 52 0 0 1 252 84\" fill=\"none\" stroke=\"#FFE7A3\" stroke-width=\"10\"/>  <g fill=\"none\" stroke=\"#C25E00\" stroke-width=\"13\">    <path d=\"M282 112 A38 38 0 1 0 282 168\"/>    <path d=\"M216 130 H268 M216 150 H262\"/>  </g>  <!-- cola -->  <path d=\"M76 296 C54 300 36 288 40 270 C44 252 70 254 70 270 C70 284 52 284 50 274\" fill=\"none\" stroke-width=\"12\"/>  <!-- oreja trasera -->  <path d=\"M300 214 L330 158 Q348 196 352 232 Z\" fill=\"#DB4C8E\"/>  <!-- cuerpo -->  <ellipse cx=\"240\" cy=\"318\" rx=\"168\" ry=\"122\" fill=\"#F472B6\"/></g><g clip-path=\"url(#bodyc)\">  <ellipse cx=\"230\" cy=\"430\" rx=\"200\" ry=\"70\" fill=\"#E0559A\" opacity=\".75\"/>  <path d=\"M120 250 A140 110 0 0 1 220 208\" fill=\"none\" stroke=\"#FBB6D9\" stroke-width=\"12\" stroke-linecap=\"round\"/></g><g stroke=\"#262626\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-linejoin=\"round\">  <ellipse cx=\"240\" cy=\"318\" rx=\"168\" ry=\"122\" fill=\"none\"/>  <!-- patas delanteras -->  <rect x=\"128\" y=\"398\" width=\"50\" height=\"72\" rx=\"15\" fill=\"#F472B6\"/>  <rect x=\"330\" y=\"398\" width=\"50\" height=\"72\" rx=\"15\" fill=\"#F472B6\"/>  <!-- ranura -->  <path d=\"M200 204 H296\" stroke-width=\"15\"/>  <!-- oreja -->  <path d=\"M320 222 L354 160 Q378 208 376 246 Z\" fill=\"#F9A8D4\"/>  <!-- hocico -->  <rect x=\"384\" y=\"282\" width=\"62\" height=\"72\" rx=\"24\" fill=\"#F9A8D4\"/>  <ellipse cx=\"406\" cy=\"318\" rx=\"5\" ry=\"9\" fill=\"#262626\" stroke-width=\"0\"/>  <ellipse cx=\"426\" cy=\"318\" rx=\"5\" ry=\"9\" fill=\"#262626\" stroke-width=\"0\"/>  <!-- ojo -->  <path d=\"M332 278 Q348 292 364 278\" fill=\"none\" stroke-width=\"11\"/></g><circle cx=\"340\" cy=\"320\" r=\"17\" fill=\"#FB7185\" opacity=\".55\"/><!-- destellos --><path d=\"M352 70l4.5 11 11 4.5-11 4.5L352 101l-4.5-11L336 85.5l11-4.5z\" fill=\"#FFC21A\" stroke=\"#262626\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M150 90l3 7.5 7.5 3-7.5 3L150 111l-3-7.5-7.5-3 7.5-3z\" fill=\"#34D399\" stroke=\"#262626\" stroke-width=\"4\" stroke-linejoin=\"round\"/>";

/* ═════════ UTILIDADES ═════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n || 0).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const num = n => Number(n).toLocaleString('es-ES');
const fdate = i => new Date(i).toLocaleString('es-ES', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const fday = i => new Date(i).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'});
const S = {token: localStorage.getItem('bf_t') || '', role:'', user:null, poll:null, sol:[], res:{}};
const A = {clients:[], sol:[], tab:'pe', hf:''};

async function call(action, data = {}) {
  let r;
  try {
    r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, token:S.token, ...data})});
  } catch (e) { throw new Error('Sin conexión con el servidor'); }
  const j = await r.json();
  if (!j.ok) { if (/Sesión caducada/.test(j.error) && S.token) logout(true); throw new Error(j.error); }
  return j.data;
}
function toast(msg, type = '') {
  const d = document.createElement('div'); d.className = 'tt ' + type; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), 3800);
}
async function act(btn, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try { await fn(); } catch (e) { toast(e.message, 'bad'); }
  finally { btn.disabled = false; btn.innerHTML = old; }
}
function countUp(el, from, to, ms = 900) {
  const t0 = performance.now();
  (function f(t) {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = num(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}
function modal(html) {
  closeModal();
  const o = document.createElement('div'); o.className = 'ov'; o.id = 'modal';
  o.innerHTML = `<div class="glass">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }

/* confeti */
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], running = false;
function rs() { fx.width = innerWidth; fx.height = innerHeight; } addEventListener('resize', rs); rs();
function confetti(n = 140) {
  const cols = ['#ec4899','#fb923c','#fbbf24','#34d399','#f472b6'];
  for (let i = 0; i < n; i++) parts.push({x:innerWidth/2, y:innerHeight*.4, vx:(Math.random()-.5)*16, vy:Math.random()*-15-4, s:Math.random()*8+5, c:cols[i%5], r:Math.random()*6, vr:(Math.random()-.5)*.4, life:130});
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function loop() {
  cx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => {
    p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life/40);
    cx.fillStyle = p.c; cx.fillRect(-p.s/2, -p.s/2, p.s, p.s*.6); cx.restore();
  });
  if (parts.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0, 0, fx.width, fx.height); }
}


/* ═════════ SIN AUTORRELLENO AL ABRIR ═════════ */
// Los campos del login nacen en solo lectura para que Chrome no meta la cuenta guardada al abrir.
// Al tocar un campo se desbloquea y Chrome ofrece las cuentas guardadas como sugerencia.
function noAutofill() {
  const ins = [...document.querySelectorAll('.authbox input[readonly]')];
  let tocado = false;
  ins.forEach(i => {
    const on = () => { tocado = true; ins.forEach(x => x.removeAttribute('readonly')); };
    i.addEventListener('pointerdown', on); i.addEventListener('focus', on); i.addEventListener('keydown', on);
  });
  const limpia = () => { if (!tocado) ins.forEach(i => { if (i.id === 'pw' || !i.defaultValue) i.value = ''; }); };
  [50, 300, 1000].forEach(ms => setTimeout(limpia, ms));
}

/* ═════════ LLAVE NFC (mantener ENTRAR 3 s) ═════════ */
function bindLongPress(btn) {
  let t = null;
  const stop = () => { if (t) { clearTimeout(t); t = null; } btn.classList.remove('lp'); if (btn._lp) setTimeout(() => { btn._lp = false; }, 500); };
  btn.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    btn.classList.add('lp');
    t = setTimeout(() => { t = null; btn._lp = true; btn.classList.remove('lp'); if (navigator.vibrate) navigator.vibrate(60); llaveModal(); }, 3000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
function llaveModal() {
  modal(`<h3>🔑 Entrar con llave NFC</h3><p class="mut">¿Dónde vas a acercar la llave?</p>
    <div style="display:grid;gap:10px;margin-top:16px">
      <button class="btn big" id="lvAqui">📱 En este dispositivo</button>
      <button class="btn ghost big" id="lvQr">🔳 En otro móvil (escanear QR)</button>
      <button class="link" onclick="closeModal()">Cancelar</button></div>
    <p class="mut" id="lvMsg" style="font-size:13px;margin-top:10px;text-align:center"></p>`);
  let ses = null, err = null;
  const pide = call('llaveSesion').then(d => { ses = d; }).catch(e => { err = e; });
  const listo = async () => { await pide; if (err) throw err; return ses; };
  $('#lvAqui').onclick = async () => {
    let w = null;
    if (ses) w = window.open(ses.url, '_blank');           // abrir ya, conservando el toque
    else w = window.open('about:blank', '_blank');
    try { const s = await listo(); if (w && !ses_abierta(w, s)) {} llaveEsperar(s, 'aqui'); }
    catch (e) { if (w) w.close(); const m = $('#lvMsg'); if (m) m.textContent = e.message; }
  };
  $('#lvQr').onclick = async e => {
    try { llaveEsperar(await listo(), 'qr'); }
    catch (er) { const m = $('#lvMsg'); if (m) m.textContent = er.message; }
  };
}
function ses_abierta(w, s) { try { if (w.location.href === 'about:blank') w.location.href = s.url; } catch (e) {} return true; }
function llaveEsperar(s, modo) {
  const pie = '<p id="lvSt" class="mut" style="text-align:center;margin:14px 0 6px">⏳ Esperando la llave…</p><button class="btn ghost" style="width:100%" onclick="closeModal()">Cancelar</button>';
  if (modo === 'qr') {
    modal(`<h3>Escanea con el móvil de la llave</h3>
      <div style="text-align:center;margin:12px 0"><div id="lvqr" style="background:#fff;padding:12px;border-radius:14px;display:inline-block"></div></div>
      <p class="mut" style="font-size:13px">Abre el enlace en un Android con NFC, acerca tu llave por detrás del móvil y esta pantalla entrará sola.</p>` + pie);
    new QRCode($('#lvqr'), { text: s.url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  } else {
    modal(`<h3>Acerca tu llave</h3>
      <p class="mut" style="font-size:13px">Se ha abierto el lector NFC en otra pestaña. Acerca la llave por detrás del móvil; cuando suene, vuelve aquí y entrarás solo.</p>
      <a class="btn big" style="display:block;text-decoration:none;text-align:center;margin-top:12px" href="${s.url}" target="_blank" rel="noopener">Abrir el lector NFC</a>` + pie);
  }
  const tick = async () => {
    if (!$('#lvSt')) return; // modal cerrado: dejamos de preguntar
    try {
      const r = await call('llaveEstado', { codigo: s.codigo });
      const st = $('#lvSt'); if (!st) return;
      if (r.estado === 'ok') {
        S.token = r.token; localStorage.setItem('bf_t', r.token);
        closeModal(); toast('🔑 Hola' + (r.nombre ? ', ' + r.nombre : ''), 'ok'); await boot(); return;
      }
      if (r.estado === 'denegado') { st.innerHTML = '❌ ' + esc(r.motivo || 'Llave no autorizada') + '<br><button class="link" onclick="llaveModal()">Probar otra vez</button>'; return; }
      if (r.estado === 'caducado') { st.innerHTML = '⌛ El código ha caducado.<br><button class="link" onclick="llaveModal()">Generar otro</button>'; return; }
    } catch (e) {}
    setTimeout(tick, 1500);
  };
  setTimeout(tick, 1500);
}

/* ═════════ COMPARTIR APP ═════════ */
const SHARE_URL = 'https://puntofibra.github.io/bonificaciones/';
async function shareApp() {
  const data = { title: APP, text: 'Pide la devolución de tus recibos de fibra y móvil con la app de ' + APP + ' de FuturMovil.', url: SHARE_URL };
  if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const txt = encodeURIComponent(data.text + ' ' + SHARE_URL);
  modal(`<h3>Compartir la app</h3><p class="mut" style="word-break:break-all">${SHARE_URL}</p>
    <div style="display:grid;gap:10px;margin-top:14px">
      <a class="btn big" style="text-decoration:none;text-align:center;background:#25d366" href="https://wa.me/?text=${txt}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn ghost" style="text-decoration:none;text-align:center" href="mailto:?subject=${encodeURIComponent(APP)}&body=${txt}">Correo</a>
      <button class="btn ghost" onclick="navigator.clipboard.writeText(SHARE_URL).then(()=>{toast('Enlace copiado','ok');closeModal();})">Copiar enlace</button>
      <button class="link" onclick="closeModal()">Cerrar</button></div>`);
}

/* ═════════ GOOGLE AUTHENTICATOR (ADMIN) ═════════ */
async function totpBox() {
  const el = $('#totpbox'); if (!el) return;
  let st; try { st = await call('totpStatus'); } catch (e) { el.innerHTML = '<h3>Acceso con Google Authenticator</h3><p class="mut">No se pudo cargar.</p>'; return; }
  if (!$('#totpbox')) return;
  el.innerHTML = '<h3>Acceso con Google Authenticator</h3>' + (st.activo
    ? '<p class="mut" style="font-size:13px">✅ <b>Activado.</b> Para entrar como administrador deja el <b>correo vacío</b> y pon en la contraseña el <b>código de 6 cifras</b> que te da Google Authenticator.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="tre">Vincular otro móvil</button><button class="btn ghost" id="toff">Desactivar</button></div>'
    : '<p class="mut" style="font-size:13px">Entra como administrador sin escribir el correo: solo con el código de 6 cifras de Google Authenticator. Tu correo y contraseña siguen funcionando igual.</p><button class="btn" id="ton">Configurar</button>');
  const b = $('#ton') || $('#tre'); if (b) b.onclick = e => act(e.currentTarget, totpSetup);
  const off = $('#toff'); if (off) off.onclick = e => { if (confirm('¿Desactivar el acceso con Google Authenticator?')) act(e.currentTarget, async () => { await call('totpDisable'); toast('Desactivado', 'ok'); totpBox(); }); };
}
async function totpSetup() {
  const d = await call('totpStart');
  modal(`<h3>Vincular Google Authenticator</h3>
    <p class="mut" style="text-align:left">1. En Google Authenticator pulsa <b>+</b> y luego <b>Escanear un código QR</b>:</p>
    <div style="text-align:center"><div id="tqr" style="background:#fff;padding:12px;border-radius:14px;display:inline-block"></div></div>
    <p class="mut" style="font-size:12px;text-align:left;margin-top:10px">¿Estás en el mismo móvil? Pulsa <a href="${d.uri}" style="color:var(--b)">abrir en Authenticator</a> o elige <b>Introducir clave de configuración</b> y pega esta clave (toca para copiar):<br><code id="tsec" style="display:block;margin-top:6px;padding:8px;border-radius:8px;background:rgba(255,255,255,.08);word-break:break-all;cursor:pointer">${d.secret}</code></p>
    <p class="mut" style="text-align:left">2. Escribe el código de 6 cifras que aparece:</p>
    <input id="tcd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="text-align:center;font-size:22px;letter-spacing:6px">
    <div style="display:flex;gap:10px;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="tok" style="flex:1">Activar</button></div>`);
  new QRCode($('#tqr'), { text: d.uri, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  $('#tsec').onclick = () => navigator.clipboard.writeText(d.secret).then(() => toast('Clave copiada', 'ok'));
  $('#tok').onclick = e => act(e.currentTarget, async () => {
    await call('totpConfirm', { code: $('#tcd').value.trim() });
    closeModal(); toast('Google Authenticator activado 🔐', 'ok'); totpBox();
  });
}

/* ═════════ INSTALAR PWA ═════════ */
let dip = null;
const UA = navigator.userAgent;
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const iosBrowser = !isIOS ? '' : /CriOS/i.test(UA) ? 'chrome' : /FxiOS|EdgiOS|OPiOS/i.test(UA) ? 'otro' : /FBAN|FBAV|Instagram|GSA\/|Line\/|WhatsApp|Gmail/i.test(UA) || !/Safari/i.test(UA) ? 'interno' : 'safari';
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; showInst(); });
addEventListener('appinstalled', () => { dip = null; showInst(); toast('¡App instalada! 🎉', 'ok'); });
function showInst() {
  const show = !isStandalone && (dip || isIOS);
  document.querySelectorAll('.inst').forEach(b => b.hidden = !show);
}
async function install() {
  if (dip) { dip.prompt(); await dip.userChoice; dip = null; showInst(); }
  else if (isIOS) iosHelp();
}

function iosHelp() {
  const step = (n, t) => '<li style="display:flex;gap:12px;align-items:flex-start;margin:0 0 14px"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:800;color:#fff">' + n + '</span><div style="padding-top:4px;line-height:1.45">' + t + '</div></li>';
  const lista = pasos => '<ol style="list-style:none;padding:0;margin:16px 0 18px;text-align:left">' + pasos.map((t, i) => step(i + 1, t)).join('') + '</ol>';
  const fin = 'Abre <b>Bonificaciones</b> desde el icono nuevo de tu pantalla de inicio. ¡Ya la tienes como una app!';
  let cuerpo;
  if (iosBrowser === 'interno') {
    cuerpo = '<p class="mut">Estás dentro de otra app (correo, WhatsApp…). Para instalarla tienes que abrir esta página en <b>Safari</b>:</p>' + lista([
      'Copia el enlace con el botón de abajo.',
      'Abre <b>Safari</b>, pega el enlace en la barra de direcciones y entra.',
      'Allí pulsa <b>⬇ Instalar la app</b> y sigue los pasos.'
    ]) + '<button class="btn big" onclick="navigator.clipboard.writeText(location.origin+location.pathname).then(()=>toast(\'Enlace copiado\',\'ok\'))">Copiar enlace</button>';
  } else {
    const donde = iosBrowser === 'chrome' ? 'arriba a la derecha, en la barra de direcciones de Chrome' : 'en la barra de Safari (abajo en iPhone, arriba en iPad). Si no lo ves, toca <b>···</b> y luego <b>Compartir</b>';
    cuerpo = '<p class="mut">En iPhone no hay botón automático: se instala en 3 toques.</p>' + lista([

function logout(expired) {
  S.token = ''; localStorage.removeItem('bf_t'); clearInterval(S.poll); clearInterval(S.qrTimer); stopScan(); closeModal();
  A.clients = []; A.sol = [];
  authView('login'); if (expired === true) toast('Tu sesión ha caducado', 'bad');
}
async function boot() {
  if (API.indexOf('PEGA_AQUI') === 0) { $('#app').innerHTML = '<div class="auth"><div class="glass authbox"><h3>Falta configurar</h3><p class="mut">Edita index.html y pon la URL de tu Web App en <b>API</b>.</p></div></div>'; return; }
  // Enlace "Entrar ahora" del correo de bienvenida: #entrar=<correo y contraseña temporal>
  if (location.hash.indexOf('#entrar=') === 0) {
    const h = location.hash.slice(8);
    history.replaceState(null, '', location.pathname + location.search); // se borra de la barra al momento
    let em = '', pw = '';
    try { [em, pw] = atob(h.replace(/-/g, '+').replace(/_/g, '/')).split('\n'); } catch (e) {}
    if (em && pw) {
      try {
        const d = await call('login', { email: em, password: pw });
        S.token = d.token; localStorage.setItem('bf_t', d.token);
        setTimeout(() => toast('¡Bienvenido! Puedes cambiar tu contraseña con 🔑', 'ok'), 800);
      } catch (e) {
        S.token = null; localStorage.removeItem('bf_t');
        authView('login', em); setTimeout(() => toast('Esa contraseña temporal ya no vale: entra con tu contraseña actual', 'bad'), 300);
        return;
      }
    }
  }
  if (!S.token) return authView('login');
  try { const d = await call('me'); S.role = d.role; d.role === 'admin' ? adminView(d) : clientView(d); }
  catch (e) { if (S.token) { authView('login'); toast(e.message, 'bad'); } }
}

function bindTilt() {

      c.style.setProperty('--ry', ((x - .5) * 18) + 'deg'); c.style.setProperty('--rx', ((.5 - y) * 18) + 'deg');
      c.style.setProperty('--mx', x * 100 + '%'); c.style.setProperty('--my', y * 100 + '%');

const MET = {bizum:'📱 Bizum', transferencia:'🏦 Transferencia', efectivo:'💵 Efectivo'};
const chip = e => `<span class="stc ${(EST[e] || {}).cls || ''}">${(EST[e] || {}).ico || ''} ${(EST[e] || {}).txt || e}</span>`;
const quien = n => n && String(n).indexOf('@') < 0 ? String(n) : '';
const maskIban = i => { const s = String(i || '').replace(/\s/g, ''); return s ? s.slice(0, 4) + ' •••• •••• ' + s.slice(-4) : '—'; };
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function copyTxt(t, what) { navigator.clipboard.writeText(String(t).replace(/\s/g, what === 'IBAN' ? ' ' : '')).then(() => toast('📋 ' + (what || 'Copiado') + ' copiado', 'ok')).catch(() => toast('No se pudo copiar', 'bad')); }
function copyBtn(t, what) { return `<button class="cp" title="Copiar" onclick="event.stopPropagation();copyTxt('${esc(t)}','${what}')">📋</button>`; }
function countEur(el, from, to, ms = 1000) {
  const t0 = performance.now();
  (function f(t) {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = eur(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}
function timeline(s, admin) {
  const paso = (on, ico, t, sub) => `<div class="tl-s ${on ? 'on' : ''}"><i>${ico}</i><div><b>${t}</b><small>${sub || ''}</small></div></div>`;
  if (s.estado === 'rechazada' || s.estado === 'cancelada') return `<div class="tl">${paso(true, '📝', 'Solicitada', fdate(s.creada))}${paso(true, EST[s.estado].ico, EST[s.estado].txt, s.motivo ? esc(s.motivo) : fdate(s.actualizada))}</div>`;
  const vq = admin && quien(s.verificadoPor) ? ' · por ' + esc(s.verificadoPor) : '', pq = admin && quien(s.pagadoPor) ? ' · por ' + esc(s.pagadoPor) : '';
  return `<div class="tl">${paso(true, '📝', 'Solicitada', fdate(s.creada))}
    ${paso(s.estado !== 'pendiente', '🔎', 'Verificada', s.verificada ? fday(s.verificada) + vq : 'Estamos revisándola')}
    ${paso(s.estado === 'pagada', '💸', 'Pagada', s.fechaPago ? fday(s.fechaPago) + ' · ' + (MET[s.metodo] || '') + pq : 'En espera de pago')}</div>`;
}

/* historial de pagos (archivo): cada pago = un grupo (lote) */
function pagosDe(lista) {
  const g = {};
  lista.filter(s => s.estado === 'pagada').forEach(s => { const k = s.lote || s.id; (g[k] = g[k] || []).push(s); });
  return Object.values(g).map(l => {
    const c = l[0], total = Math.round(l.reduce((x, s) => x + s.importe, 0) * 100) / 100;
    return {k: c.lote || c.id, nombre: c.nombre, idCliente: c.idCliente, fecha: c.fechaPago, metodo: c.metodo, items: l, total, quien: quien(c.pagadoPor), verif: quien(c.verificadoPor),
      lineas: c.lote ? c.lineas : 0, descuento: c.lote ? c.descuento : 0, neto: c.lote ? c.neto : total};
  }).sort((x, y) => new Date(y.fecha) - new Date(x.fecha));
}

    <div class="box"><b>💸 ¿Ya está pagado?</b><div class="seg" id="yp" style="margin-top:8px"><button data-v="no" class="on">No, solo verificar</button><button data-v="si">Sí, ya está pagado</button></div>
      <div id="ypf" hidden>${pagoCampos(c)}</div></div>
    <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="pok">Verificar</button></div>`);
  let tiene = false, pagado = false;
  const sel = () => [...document.querySelectorAll('.rck')].filter(x => x.checked).map(x => x.value);
  const vals = () => {

  };
  let P = null;
  document.querySelectorAll('.rck').forEach(x => x.onchange = calc);
  document.querySelectorAll('#ql button').forEach(b => b.onclick = () => { document.querySelectorAll('#ql button').forEach(x => x.classList.toggle('on', x === b)); tiene = b.dataset.v === 'si'; $('#qn').hidden = !tiene; calc(); if (tiene) $('#ln').focus(); });

/* ═════════ IBAN (validación en el navegador) ═════════ */
const BANCOS = {'0049':'Santander','0075':'Santander','0030':'Santander','0182':'BBVA','2100':'CaixaBank','2038':'CaixaBank','0081':'Sabadell','0128':'Bankinter','1465':'ING','0073':'Openbank','2080':'Abanca','3058':'Cajamar','2085':'Ibercaja','2095':'Kutxabank','2103':'Unicaja','2048':'Unicaja','0239':'EVO Banco','1491':'Triodos','3035':'Laboral Kutxa','0061':'Banca March','0186':'Mediolanum','0019':'Deutsche Bank','1583':'Revolut','0237':'Cajasur','0487':'BMN','3025':'Caixa d\'Enginyers','0216':'Targobank'};
function ibanValido(v) {
  const i = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(i)) return false;
  const L = {ES:24, PT:25, FR:27, DE:22, IT:27, GB:22, NL:18, BE:16, AD:24, LT:20, IE:22, LU:20, AT:20, CH:21}[i.slice(0, 2)];
  if (L && i.length !== L) return false;
  let m = 0;
  for (const ch of i.slice(4) + i.slice(0, 4)) { const v2 = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch; for (const d of v2) m = (m * 10 + +d) % 97; }
  if (m !== 1) return false;
  if (i.startsWith('ES')) {
    const c = i.slice(4), w = [1, 2, 4, 8, 5, 10, 9, 7, 3, 6];
    const dc = s => { let t = 0; for (let k = 0; k < 10; k++) t += +s[k] * w[k]; const r = 11 - (t % 11); return r === 11 ? 0 : r === 10 ? 1 : r; };
    if ('' + dc('00' + c.slice(0, 8)) + dc(c.slice(10)) !== c.slice(8, 10)) return false;
  }
  return true;
}
function ibanLive(el) {
  if (!el) return;
  const raw = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 34);
  const pos = el.selectionStart, before = el.value.length;
  el.value = raw.replace(/(.{4})/g, '$1 ').trim();
  try { const d = el.value.length - before; el.setSelectionRange(pos + d, pos + d); } catch (e) {}
  const o = $('#' + el.id + '_i'); if (!o) return;
  const ok = ibanValido(raw);
  el.classList.toggle('good', ok); el.classList.toggle('badi', raw.length >= 15 && !ok);
  o.innerHTML = !raw ? '' : ok ? '✅ IBAN correcto' + (raw.startsWith('ES') && BANCOS[raw.slice(4, 8)] ? ' · ' + BANCOS[raw.slice(4, 8)] : '') : raw.length < (raw.startsWith('ES') ? 24 : 15) ? '<span class="mut">' + raw.length + (raw.startsWith('ES') ? '/24' : '') + ' caracteres…</span>' : '<span style="color:var(--bad)">❌ Este IBAN no es válido, revisa los números</span>';
}


boot();
</script>
</body>
</html>
